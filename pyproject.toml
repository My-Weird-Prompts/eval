[project]
name = "mwp-eval"
version = "1.0.0"
description = "MWP-Script: a benchmark for long-form two-host podcast script writing, from My Weird Prompts"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "inspect-ai==0.3.273",
    "datasets>=3",
    "openai>=1.99",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mwp_eval"]
